<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Building Permits Dashboard</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; }
    
    header { background-color: #1e293b; color: #fff; padding: 15px 20px; text-align: center; }
    
    .container { display: flex; flex-direction: column; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    
    /* Search Bar */
    .search-box { width: 100%; padding: 10px 15px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; }

    /* Map Container */
    #map { height: 400px; width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    
    /* Table Styling */
    .table-container { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background-color: #0f172a; color: #fff; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:hover { background-color: #e2e8f0; cursor: pointer; }
    
    .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; background: #e2e8f0; }

    /* Modal Overlay for Detailed Info */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; width: 90%; max-width: 700px; border-radius: 8px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 22px; cursor: pointer; font-weight: bold; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
    .details-section { grid-column: span 2; font-weight: bold; font-size: 16px; margin-top: 10px; border-bottom: 2px solid #0f172a; padding-bottom: 4px; color: #0f172a; }
  </style>
</head>
<body>

  <header>
    <h1>MBANI WebGIS - Building Permits Dashboard</h1>
  </header>

  <div class="container">
    <!-- Instant Search Bar -->
    <input type="text" id="search-input" class="search-box" placeholder="Search by Applicant Name, Permit No, Land Title, or NIU..." />

    <!-- Map Element -->
    <div id="map"></div>

    <!-- Data Table Element -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Permit No</th>
            <th>Applicant</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Building Use</th>
            <th>Floors</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="permits-table-body">
          <tr><td colspan="7" style="text-align:center;">Loading permit data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Detail Pop-Up Modal -->
  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modal-title">Permit Details</h2>
      <div id="modal-body" class="details-grid"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="app.js"></script>
</body>
</html>
